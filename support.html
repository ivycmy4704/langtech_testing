<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Support - ProGen AI</title>
  <style>
    body {font-family:Arial; background:#f4f6f9; margin:0; padding:20px; padding-top:100px;}
    nav {position:fixed; top:0; left:0; right:0; background:white; padding:15px; box-shadow:0 4px 10px rgba(0,0,0,0.1); text-align:center; font-size:20px; font-weight:bold; color:#667eea;}
    .box {max-width:600px; margin:0 auto; background:white; padding:30px; border-radius:15px; box-shadow:0 10px 30px rgba(0,0,0,0.1);}
    h1 {margin-top:0; color:#667eea; text-align:center;}
    .subtitle {text-align:center; color:#666; margin:10px 0 25px; font-size:16px;}
    input, textarea {width:100%; padding:15px; margin:10px 0; border:2px solid #ddd; border-radius:10px; font-size:16px; box-sizing:border-box;}
    button {background:#667eea; color:white; padding:15px; border:none; border-radius:10px; font-size:18px; cursor:pointer; width:100%;}
    button:hover {background:#5a6fd8;}
    .ok {display:none; background:#d4edda; color:#155724; padding:15px; border-radius:10px; margin-top:15px;}
  </style>
</head>
<body>

<nav>ProGen AI – Support</nav>

<div class="box">
  <h1>Support Dropbox</h1>
  <div class="subtitle">Send a message — admin sees it instantly!</div>

  <input type="text" id="subject" placeholder="Subject" required>
  <textarea id="msg" rows="6" placeholder="Your message..." required></textarea>
  <button onclick="send()">SEND MESSAGE</button>
  <div class="ok" id="ok">Message sent! Admin received it instantly.</div>
</div>

<script>
function send() {
  const subject = document.getElementById('subject').value.trim();
  const msg = document.getElementById('msg').value.trim();

  if (!subject || !msg) {
    alert("Please fill both fields");
    return;
  }

  // Simulate logged-in user (replace with real data when you have login)
  const user = {
    company: "ABC Corp",        // CHANGE THIS TO TEST DIFFERENT NAMES
    email: "user@abc.com"
  };

  const ticket = {
    id: Date.now(),
    company: user.company,
    email: user.email,
    subject: subject,
    message: msg,
    date: new Date().toLocaleString(),
    status: "open"
  };

  let list = JSON.parse(localStorage.getItem("supportTickets") || "[]");
  list.unshift(ticket);
  localStorage.setItem("supportTickets", JSON.stringify(list));

  document.getElementById("ok").style.display = "block";
  document.getElementById("subject").value = "";
  document.getElementById("msg").value = "";
  setTimeout(() => document.getElementById("ok").style.display = "none", 3000);
}
</script>

</body>
</html>
