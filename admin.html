<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin - ProGen AI</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* ---- Simple modal styling (you can move this to style.css) ---- */
    #adminModal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); display: flex; align-items: center;
      justify-content: center; z-index: 9999;
    }
    .modal-content {
      background: #fff; padding: 2rem; border-radius: 8px; width: 320px;
      box-shadow: 0 4px 12px rgba(0,0,0,.2);
    }
    .modal-content h3 { margin-top: 0; }
    .modal-content .input-group { margin-bottom: 1rem; }
    .modal-content label { display: block; margin-bottom: .4rem; font-weight: 600; }
    .modal-content input { width: 100%; padding: .5rem; border: 1px solid #ccc; border-radius: 4px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: .5rem; }
    .modal-actions button { padding: .5rem 1rem; border: none; border-radius: 4px; cursor: pointer; }
    .modal-actions .btn-primary { background: #0066cc; color:#fff; }
    .modal-actions .btn-secondary { background: #ddd; }

    /* Additional styles for login history and tickets */
    .login-history { margin-top: 2rem; }
    .history-item { 
      background: #f8f9fa; 
      padding: 0.75rem; 
      margin-bottom: 0.5rem; 
      border-radius: 4px; 
      border-left: 4px solid #0066cc;
    }
    .ticket-item { 
      background: #f8f9fa; 
      padding: 1rem; 
      margin-bottom: 1rem; 
      border-radius: 4px; 
      border: 1px solid #ddd;
    }
    .ticket-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 0.5rem;
    }
    .ticket-status { 
      padding: 0.25rem 0.75rem; 
      border-radius: 12px; 
      font-size: 0.75rem; 
      font-weight: bold;
    }
    .status-open { background: #d4edda; color: #155724; }
    .status-closed { background: #f8d7da; color: #721c24; }
    .status-pending { background: #fff3cd; color: #856404; }
    .ticket-message { 
      background: white; 
      padding: 0.75rem; 
      border-radius: 4px; 
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

  <!-- ==== ADMIN LOGIN MODAL ==== -->
  <div id="adminModal">
    <div class="modal-content">
      <h3>Admin Login</h3>
      <form id="adminLoginForm">
        <div class="input-group">
          <label for="adminName">Admin Name</label>
          <input type="text" id="adminName" required placeholder="Enter admin name" />
        </div>
        <div class="input-group">
          <label for="adminPass">Password</label>
          <input type="password" id="adminPass" required placeholder="Enter password" />
        </div>
        <div class="modal-actions">
          <button type="button" id="cancelBtn" class="btn-secondary">Cancel</button>
          <button type="submit" class="btn-primary">Login</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ==== MAIN ADMIN UI (hidden until logged in) ==== -->
  <div id="adminPanel" style="display:none;">
    <nav class="navbar">
      <div class="logo">Admin Panel</div>
      <div><a href="index.html" id="logoutLink">Logout</a></div>
    </nav>

    <div class="container">
      <div class="card">
        <h2>Manage Customers</h2>
        <input type="text" id="search" placeholder="Search..." class="search-bar" oninput="renderUsers()" />

        <table id="userTable" class="table">
          <thead>
            <tr>
              <th>Company</th>
              <th>Email</th>
              <th>Industry</th>
              <th>Credits</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="card">
        <h2>User Login History</h2>
        <div id="loginHistory" class="login-history">
          <!-- Login history will be populated here -->
        </div>
      </div>

      <div class="card">
        <h2>Support Tickets</h2>
        <div id="tickets" class="tickets-container">
          <!-- Tickets will be populated here -->
        </div>
      </div>
    </div>
  </div>

  <!-- ==== SCRIPTS ==== -->
  <script>
    // ---------- CONFIG ----------
    const ADMIN_NAME = 'admin';
    const ADMIN_PASS = 'admin001';

    // ---------- ELEMENTS ----------
    const modal      = document.getElementById('adminModal');
    const panel      = document.getElementById('adminPanel');
    const form       = document.getElementById('adminLoginForm');
    const cancelBtn  = document.getElementById('cancelBtn');
    const logoutLink = document.getElementById('logoutLink');

    // ---------- SESSION HELPERS ----------
    const setAdminSession = () => sessionStorage.setItem('adminAuth', 'true');
    const clearAdminSession = () => sessionStorage.removeItem('adminAuth');
    const isAdminAuthenticated = () => sessionStorage.getItem('adminAuth') === 'true';

    // ---------- AUTH CHECK ON LOAD ----------
    if (isAdminAuthenticated()) {
      modal.style.display = 'none';
      panel.style.display = 'block';
      // Load data when authenticated
      setTimeout(() => {
        if (typeof renderUsers === 'function') renderUsers();
        if (typeof renderLoginHistory === 'function') renderLoginHistory();
        if (typeof renderTickets === 'function') renderTickets();
      }, 100);
    }

    // ---------- FORM SUBMIT ----------
    form.addEventListener('submit', e => {
      e.preventDefault();
      const name = document.getElementById('adminName').value.trim();
      const pass = document.getElementById('adminPass').value;

      if (name === ADMIN_NAME && pass === ADMIN_PASS) {
        setAdminSession();
        modal.style.display = 'none';
        panel.style.display = 'block';
        // Load data after login
        setTimeout(() => {
          if (typeof renderUsers === 'function') renderUsers();
          if (typeof renderLoginHistory === 'function') renderLoginHistory();
          if (typeof renderTickets === 'function') renderTickets();
        }, 100);
      } else {
        alert('Invalid admin credentials');
        document.getElementById('adminName').focus();
      }
    });

    // ---------- CANCEL BUTTON ----------
    cancelBtn.addEventListener('click', () => {
      window.location.href = 'index.html';
    });

    // ---------- LOGOUT ----------
    logoutLink.addEventListener('click', e => {
      e.preventDefault();
      clearAdminSession();
      window.location.href = 'index.html';
    });

    // Function to render login history
    function renderLoginHistory() {
      const historyContainer = document.getElementById('loginHistory');
      const loginHistory = JSON.parse(localStorage.getItem('userLoginHistory') || '[]');
      
      if (loginHistory.length === 0) {
        historyContainer.innerHTML = '<p>No login history available.</p>';
        return;
      }

      // Sort by most recent first
      loginHistory.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
      
      historyContainer.innerHTML = loginHistory.map(login => `
        <div class="history-item">
          <strong>${login.company}</strong> (${login.email})<br>
          <small>Logged in: ${new Date(login.timestamp).toLocaleString()}</small>
        </div>
      `).join('');
    }

    // Function to render tickets
    function renderTickets() {
      const ticketsContainer = document.getElementById('tickets');
      const tickets = JSON.parse(localStorage.getItem('supportTickets') || '[]');
      
      if (tickets.length === 0) {
        ticketsContainer.innerHTML = '<p>No support tickets available.</p>';
        return;
      }

      // Sort by most recent first
      tickets.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      
      ticketsContainer.innerHTML = tickets.map(ticket => `
        <div class="ticket-item">
          <div class="ticket-header">
            <strong>${ticket.company} - ${ticket.subject}</strong>
            <span class="ticket-status status-${ticket.status}">${ticket.status}</span>
          </div>
          <div><strong>From:</strong> ${ticket.email}</div>
          <div class="ticket-message">
            <strong>Message:</strong><br>${ticket.message}
          </div>
          <div><small>Submitted: ${new Date(ticket.createdAt).toLocaleString()}</small></div>
          <div style="margin-top: 0.5rem;">
            <button class="btn-sm btn-success" onclick="updateTicketStatus('${ticket.id}', 'closed')">Mark Closed</button>
            <button class="btn-sm btn-secondary" onclick="updateTicketStatus('${ticket.id}', 'open')">Reopen</button>
            <button class="btn-sm" style="background:var(--danger);color:white;" onclick="deleteTicket('${ticket.id}')">Delete</button>
          </div>
        </div>
      `).join('');
    }

    // Function to update ticket status
    function updateTicketStatus(ticketId, status) {
      let tickets = JSON.parse(localStorage.getItem('supportTickets') || '[]');
      const ticketIndex = tickets.findIndex(t => t.id === ticketId);
      
      if (ticketIndex !== -1) {
        tickets[ticketIndex].status = status;
        tickets[ticketIndex].updatedAt = new Date().toISOString();
        localStorage.setItem('supportTickets', JSON.stringify(tickets));
        renderTickets();
      }
    }

    // Function to delete ticket
    function deleteTicket(ticketId) {
      if (confirm('Are you sure you want to delete this ticket?')) {
        let tickets = JSON.parse(localStorage.getItem('supportTickets') || '[]');
        tickets = tickets.filter(t => t.id !== ticketId);
        localStorage.setItem('supportTickets', JSON.stringify(tickets));
        renderTickets();
      }
    }
  </script>

  <!-- Your existing admin scripts -->
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
