<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin - ProGen AI</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* ---- Simple modal styling (you can move this to style.css) ---- */
    #adminModal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); display: flex; align-items: center;
      justify-content: center; z-index: 9999;
    }
    .modal-content {
      background: #fff; padding: 2rem; border-radius: 8px; width: 320px;
      box-shadow: 0 4px 12px rgba(0,0,0,.2);
    }
    .modal-content h3 { margin-top: 0; }
    .modal-content .input-group { margin-bottom: 1rem; }
    .modal-content label { display: block; margin-bottom: .4rem; font-weight: 600; }
    .modal-content input { width: 100%; padding: .5rem; border: 1px solid #ccc; border-radius: 4px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: .5rem; }
    .modal-actions button { padding: .5rem 1rem; border: none; border-radius: 4px; cursor: pointer; }
    .modal-actions .btn-primary { background: #0066cc; color:#fff; }
    .modal-actions .btn-secondary { background: #ddd; }

    /* Additional styles for login history and tickets */
    .login-history { margin-top: 2rem; }
    .history-item { 
      background: #f8f9fa; 
      padding: 0.75rem; 
      margin-bottom: 0.5rem; 
      border-radius: 4px; 
      border-left: 4px solid #0066cc;
    }
    .ticket-item { 
      background: #f8f9fa; 
      padding: 1rem; 
      margin-bottom: 1rem; 
      border-radius: 4px; 
      border: 1px solid #ddd;
    }
    .ticket-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 0.5rem;
    }
    .ticket-status { 
      padding: 0.25rem 0.75rem; 
      border-radius: 12px; 
      font-size: 0.75rem; 
      font-weight: bold;
    }
    .status-open { background: #d4edda; color: #155724; }
    .status-closed { background: #f8d7da; color: #721c24; }
    .status-pending { background: #fff3cd; color: #856404; }
    .ticket-message { 
      background: white; 
      padding: 0.75rem; 
      border-radius: 4px; 
      margin-top: 0.5rem;
    }
    
    /* User stats */
    .user-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: #f8f9fa;
      padding: 1.5rem;
      border-radius: 8px;
      text-align: center;
      border-left: 4px solid #0066cc;
    }
    .stat-number {
      font-size: 2rem;
      font-weight: bold;
      color: #0066cc;
      display: block;
    }
    .stat-label {
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>
<body>

  <!-- ==== ADMIN LOGIN MODAL ==== -->
  <div id="adminModal">
    <div class="modal-content">
      <h3>Admin Login</h3>
      <form id="adminLoginForm">
        <div class="input-group">
          <label for="adminName">Admin Name</label>
          <input type="text" id="adminName" required placeholder="Enter admin name" />
        </div>
        <div class="input-group">
          <label for="adminPass">Password</label>
          <input type="password" id="adminPass" required placeholder="Enter password" />
        </div>
        <div class="modal-actions">
          <button type="button" id="cancelBtn" class="btn-secondary">Cancel</button>
          <button type="submit" class="btn-primary">Login</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ==== MAIN ADMIN UI (hidden until logged in) ==== -->
  <div id="adminPanel" style="display:none;">
    <nav class="navbar">
      <div class="logo">Admin Panel</div>
      <div><a href="index.html" id="logoutLink">Logout</a></div>
    </nav>

    <div class="container">
      <!-- User Statistics -->
      <div class="user-stats" id="userStats">
        <!-- Stats will be populated by JavaScript -->
      </div>

      <div class="card">
        <h2>Manage Customers</h2>
        <input type="text" id="search" placeholder="Search by company or email..." class="search-bar" oninput="renderUsers()" />

        <table id="userTable" class="table">
          <thead>
            <tr>
              <th>Company</th>
              <th>Email</th>
              <th>Industry</th>
              <th>Credits</th>
              <th>Last Login</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="card">
        <h2>User Login History</h2>
        <div id="loginHistory" class="login-history">
          <!-- Login history will be populated here -->
        </div>
      </div>

      <div class="card">
        <h2>Support Tickets</h2>
        <div id="tickets" class="tickets-container">
          <!-- Tickets will be populated here -->
        </div>
      </div>
    </div>
  </div>

  <!-- ==== SCRIPTS ==== -->
  <script>
    // ---------- CONFIG ----------
    const ADMIN_NAME = 'admin';
    const ADMIN_PASS = 'admin001';

    // ---------- ELEMENTS ----------
    const modal      = document.getElementById('adminModal');
    const panel      = document.getElementById('adminPanel');
    const form       = document.getElementById('adminLoginForm');
    const cancelBtn  = document.getElementById('cancelBtn');
    const logoutLink = document.getElementById('logoutLink');

    // ---------- SESSION HELPERS ----------
    const setAdminSession = () => sessionStorage.setItem('adminAuth', 'true');
    const clearAdminSession = () => sessionStorage.removeItem('adminAuth');
    const isAdminAuthenticated = () => sessionStorage.getItem('adminAuth') === 'true';

    // ---------- AUTH CHECK ON LOAD ----------
    if (isAdminAuthenticated()) {
      modal.style.display = 'none';
      panel.style.display = 'block';
      // Load data when authenticated
      setTimeout(() => {
        loadAdminData();
      }, 100);
    }

    // ---------- FORM SUBMIT ----------
    form.addEventListener('submit', e => {
      e.preventDefault();
      const name = document.getElementById('adminName').value.trim();
      const pass = document.getElementById('adminPass').value;

      if (name === ADMIN_NAME && pass === ADMIN_PASS) {
        setAdminSession();
        modal.style.display = 'none';
        panel.style.display = 'block';
        // Load data after login
        setTimeout(() => {
          loadAdminData();
        }, 100);
      } else {
        alert('Invalid admin credentials');
        document.getElementById('adminName').focus();
      }
    });

    // ---------- CANCEL BUTTON ----------
    cancelBtn.addEventListener('click', () => {
      window.location.href = 'index.html';
    });

    // ---------- LOGOUT ----------
    logoutLink.addEventListener('click', e => {
      e.preventDefault();
      clearAdminSession();
      window.location.href = 'index.html';
    });

    // ---------- ADMIN DATA FUNCTIONS ----------
    function loadAdminData() {
      renderUserStats();
      renderUsers();
      renderLoginHistory();
      renderTickets();
    }

    function renderUserStats() {
      const users = JSON.parse(localStorage.getItem('users') || '[]');
      const loginHistory = JSON.parse(localStorage.getItem('userLoginHistory') || '[]');
      const tickets = JSON.parse(localStorage.getItem('supportTickets') || '[]');
      
      const statsContainer = document.getElementById('userStats');
      statsContainer.innerHTML = `
        <div class="stat-card">
          <span class="stat-number">${users.length}</span>
          <span class="stat-label">Total Users</span>
        </div>
        <div class="stat-card">
          <span class="stat-number">${loginHistory.length}</span>
          <span class="stat-label">Total Logins</span>
        </div>
        <div class="stat-card">
          <span class="stat-number">${tickets.length}</span>
          <span class="stat-label">Support Tickets</span>
        </div>
        <div class="stat-card">
          <span class="stat-number">${tickets.filter(t => t.status === 'open').length}</span>
          <span class="stat-label">Open Tickets</span>
        </div>
      `;
    }

    // Function to render users table
    function renderUsers() {
      const users = JSON.parse(localStorage.getItem('users') || '[]');
      const search = document.getElementById('search').value.toLowerCase();
      const tbody = document.querySelector('#userTable tbody');
      
      console.log('Total users found:', users.length); // Debug log
      console.log('Users data:', users); // Debug log

      if (users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 2rem;">No users found. Users will appear here after they register.</td></tr>';
        return;
      }

      const filteredUsers = users.filter(u => 
        u.company?.toLowerCase().includes(search) || 
        u.email?.toLowerCase().includes(search)
      );

      if (filteredUsers.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 2rem;">No users match your search.</td></tr>';
        return;
      }

      tbody.innerHTML = filteredUsers.map(user => `
        <tr>
          <td>${user.company || 'N/A'}</td>
          <td>${user.email || 'N/A'}</td>
          <td>${user.industry || 'N/A'}</td>
          <td><input type="number" value="${user.credits || 0}" class="credit-input" data-id="${user.id}" style="width:60px;" /></td>
          <td>${user.lastLogin ? new Date(user.lastLogin).toLocaleDateString() : 'Never'}</td>
          <td>
            <button class="btn-sm btn-success" onclick="saveCredits(${user.id})">Save Credits</button>
            <button class="btn-sm btn-secondary" onclick="editUser(${user.id})">Edit</button>
            <button class="btn-sm" style="background:var(--danger);color:white;" onclick="deleteUser(${user.id})">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    // Function to render login history
    function renderLoginHistory() {
      const historyContainer = document.getElementById('loginHistory');
      const loginHistory = JSON.parse(localStorage.getItem('userLoginHistory') || '[]');
      
      console.log('Login history found:', loginHistory.length); // Debug log

      if (loginHistory.length === 0) {
        historyContainer.innerHTML = '<p>No login history available. User logins will appear here.</p>';
        return;
      }

      // Sort by most recent first
      loginHistory.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
      
      historyContainer.innerHTML = loginHistory.slice(0, 20).map(login => `
        <div class="history-item">
          <strong>${login.company || 'Unknown Company'}</strong> (${login.email || 'Unknown Email'})<br>
          <small>Logged in: ${new Date(login.timestamp).toLocaleString()}</small>
        </div>
      `).join('');
    }

    // Function to render tickets
    function renderTickets() {
      const ticketsContainer = document.getElementById('tickets');
      const tickets = JSON.parse(localStorage.getItem('supportTickets') || '[]');
      
      console.log('Tickets found:', tickets.length); // Debug log

      if (tickets.length === 0) {
        ticketsContainer.innerHTML = '<p>No support tickets available. User support requests will appear here.</p>';
        return;
      }

      // Sort by most recent first
      tickets.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      
      ticketsContainer.innerHTML = tickets.map(ticket => `
        <div class="ticket-item">
          <div class="ticket-header">
            <strong>${ticket.company || 'Guest'} - ${ticket.subject}</strong>
            <span class="ticket-status status-${ticket.status || 'open'}">${ticket.status || 'open'}</span>
          </div>
          <div><strong>From:</strong> ${ticket.email || 'Not provided'}</div>
          <div class="ticket-message">
            <strong>Message:</strong><br>${ticket.message}
          </div>
          <div><small>Submitted: ${new Date(ticket.createdAt).toLocaleString()}</small></div>
          <div style="margin-top: 0.5rem;">
            <button class="btn-sm btn-success" onclick="updateTicketStatus('${ticket.id}', 'closed')">Mark Closed</button>
            <button class="btn-sm btn-secondary" onclick="updateTicketStatus('${ticket.id}', 'open')">Reopen</button>
            <button class="btn-sm" style="background:var(--danger);color:white;" onclick="deleteTicket('${ticket.id}')">Delete</button>
          </div>
        </div>
      `).join('');
    }

    // Function to update ticket status
    function updateTicketStatus(ticketId, status) {
      let tickets = JSON.parse(localStorage.getItem('supportTickets') || '[]');
      const ticketIndex = tickets.findIndex(t => t.id === ticketId);
      
      if (ticketIndex !== -1) {
        tickets[ticketIndex].status = status;
        tickets[ticketIndex].updatedAt = new Date().toISOString();
        localStorage.setItem('supportTickets', JSON.stringify(tickets));
        renderTickets();
        renderUserStats(); // Update stats
      }
    }

    // Function to delete ticket
    function deleteTicket(ticketId) {
      if (confirm('Are you sure you want to delete this ticket?')) {
        let tickets = JSON.parse(localStorage.getItem('supportTickets') || '[]');
        tickets = tickets.filter(t => t.id !== ticketId);
        localStorage.setItem('supportTickets', JSON.stringify(tickets));
        renderTickets();
        renderUserStats(); // Update stats
      }
    }

    // User management functions
    function saveCredits(id) {
      const users = JSON.parse(localStorage.getItem('users') || '[]');
      const userIndex = users.findIndex(u => u.id === id);
      
      if (userIndex !== -1) {
        const creditInput = document.querySelector(`.credit-input[data-id="${id}"]`);
        const newCredits = parseInt(creditInput.value) || 0;
        users[userIndex].credits = newCredits;
        localStorage.setItem('users', JSON.stringify(users));
        alert('Credits saved successfully!');
        renderUsers();
      }
    }

    function editUser(id) {
      const users = JSON.parse(localStorage.getItem('users') || '[]');
      const user = users.find(u => u.id === id);
      
      if (user) {
        const newCompany = prompt('Edit Company Name:', user.company);
        if (newCompany !== null && newCompany.trim() !== '') {
          user.company = newCompany.trim();
          localStorage.setItem('users', JSON.stringify(users));
          renderUsers();
        }
      }
    }

    function deleteUser(id) {
      if (confirm('Are you sure you want to delete this user? This action cannot be undone.')) {
        let users = JSON.parse(localStorage.getItem('users') || '[]');
        users = users.filter(u => u.id !== id);
        localStorage.setItem('users', JSON.stringify(users));
        renderUsers();
        renderUserStats(); // Update stats
      }
    }
  </script>
</body>
</html>
